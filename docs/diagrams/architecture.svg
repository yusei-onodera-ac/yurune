<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1152" viewBox="0 0 1500 1152" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif"><rect width="1500" height="1152" fill="#FFFFFF"/><text x="32" y="50" font-size="27" fill="#1D2326" font-weight="700" text-anchor="start">ゆるね  システム構成図</text><text x="32" y="82" font-size="16" fill="#69757B" font-weight="400" text-anchor="start">夜の制御、会話、週の見直しは、Cloud Run の 1 つのアプリで動きます。公開と運用の仕組みも、同じ Google Cloud にあります</text><rect x="32" y="116" width="252" height="752" rx="6" fill="#FFFFFF" stroke="#D5DDDE" stroke-width="1.5"/><text x="50" y="150" font-size="18" fill="#1D2326" font-weight="700" text-anchor="start">利用者の端末</text><text x="50" y="174" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">スマホ・PC のブラウザ（PWA）</text><rect x="48" y="196" width="220" height="142" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="66" y="223" font-size="16" fill="#1D2326" font-weight="700" text-anchor="start">画面</text><text x="66" y="247" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">JSP と JavaScript。</text><text x="66" y="268" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">ぽてねの最新の返事を、</text><text x="66" y="289" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">1 行だけ出す</text><rect x="48" y="352" width="220" height="142" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="66" y="379" font-size="16" fill="#1D2326" font-weight="700" text-anchor="start">環境音</text><text x="66" y="403" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">雨・波・森を、端末の中で</text><text x="66" y="424" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">合成する（Web Audio）。</text><text x="66" y="445" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">音源のファイルは使わない</text><rect x="48" y="508" width="220" height="142" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="66" y="535" font-size="16" fill="#1D2326" font-weight="700" text-anchor="start">声を文字にする</text><text x="66" y="559" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">ブラウザの音声認識。</text><text x="66" y="580" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">音声は、このアプリの</text><text x="66" y="601" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">サーバーに送らない</text><rect x="48" y="664" width="220" height="142" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="66" y="691" font-size="16" fill="#1D2326" font-weight="700" text-anchor="start">ぽてねの声</text><text x="66" y="715" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">サーバーでつくった声を、</text><text x="66" y="736" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">環境音と同じ出力で</text><text x="66" y="757" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">流す</text><rect x="352" y="116" width="576" height="752" rx="6" fill="#FFFFFF" stroke="#D5DDDE" stroke-width="1.5"/><text x="372" y="150" font-size="18" fill="#1D2326" font-weight="700" text-anchor="start">アプリ（Cloud Run・東京）</text><text x="372" y="174" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">Java 21 + Tomcat 10.1。1〜3 台、1 台あたり同時 40 リクエスト</text><rect x="368" y="196" width="544" height="88" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="386" y="223" font-size="16" fill="#1D2326" font-weight="700" text-anchor="start">入口と層</text><text x="386" y="247" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">Filter: 認証、CSRF、セキュリティヘッダー、トレース ID</text><text x="386" y="268" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">Controller → Service → Repository（層に分けた作り）</text><rect x="368" y="292" width="544" height="109" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><rect x="368" y="292" width="5" height="109" rx="2" fill="#2E8C87" stroke="none" stroke-width="0"/><text x="386" y="319" font-size="16" fill="#1D2326" font-weight="700" text-anchor="start">夜の制御</text><text x="386" y="343" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">観測 → 判断 → 検証 → 実行 → 記録 のループ。</text><text x="386" y="364" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">Gemini がツール呼び出しで操作を選び、</text><text x="386" y="385" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">選んだ理由を 1 行つけて記録する</text><rect x="368" y="409" width="544" height="88" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><rect x="368" y="409" width="5" height="88" rx="2" fill="#2E8C87" stroke="none" stroke-width="0"/><text x="386" y="436" font-size="16" fill="#1D2326" font-weight="700" text-anchor="start">会話</text><text x="386" y="460" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">発言を検査してから Gemini に聞き、返事も検査して、</text><text x="386" y="481" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">1 行の文と、ぽてねの声で返す</text><rect x="368" y="505" width="544" height="88" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="386" y="532" font-size="16" fill="#1D2326" font-weight="700" text-anchor="start">週の見直し</text><text x="386" y="556" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">標準の夜と変えた夜を、符号反転検定で比べる。</text><text x="386" y="577" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">試す選択肢はトンプソン抽出。AI は使わない</text><rect x="368" y="601" width="544" height="151" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="386" y="628" font-size="16" fill="#1D2326" font-weight="700" text-anchor="start">固定の枠（コード）</text><text x="386" y="652" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">入力: 伏せ字 → 指示の無視 → 病気や薬（決まった文） → Model Armor</text><text x="386" y="673" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">出力: 効き目の断定、睡眠状態の推測、個人情報などを止める</text><text x="386" y="694" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">ToolGuard: 許可リスト、引数の範囲、音量の上限と上げ幅</text><text x="386" y="715" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">呼び出し: 20 秒間隔、1 日 2000 回、ブレーカー、停止スイッチ</text><text x="386" y="736" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">認証と画面: ログイン試行の制限、CSRF、CSP、利用者ごとの分離</text><rect x="368" y="760" width="544" height="88" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="386" y="787" font-size="16" fill="#1D2326" font-weight="700" text-anchor="start">判断の記録とログ</text><text x="386" y="811" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">経路（規則か Gemini か）と理由を残す。会話の本文は含めない。</text><text x="386" y="832" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">出してよい項目だけの構造化ログ。トレース ID で、夜 1 回をつなぐ</text><rect x="984" y="116" width="484" height="752" rx="6" fill="#FFFFFF" stroke="#D5DDDE" stroke-width="1.5"/><text x="1004" y="150" font-size="18" fill="#1D2326" font-weight="700" text-anchor="start">つないでいるサービス</text><text x="1004" y="174" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">Google Cloud。矢印は、呼び出しの向き</text><text x="1004" y="210" font-size="14.5" fill="#2E8C87" font-weight="700" text-anchor="start">AI と検査</text><rect x="1000" y="224" width="452" height="62" rx="6" fill="#DDEFED" stroke="#2E8C87" stroke-width="1.5"/><text x="1018" y="250" font-size="15.5" fill="#1D2326" font-weight="700" text-anchor="start">Gemini API</text><text x="1018" y="273" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">夜の判断（ツール呼び出し）と会話</text><line x1="928" y1="255" x2="991" y2="255" stroke="#69757B" stroke-width="1.6"/><path d="M 1000 255 L 991 260 L 991 250 z" fill="#69757B"/><rect x="1000" y="294" width="452" height="62" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="1018" y="320" font-size="15.5" fill="#1D2326" font-weight="700" text-anchor="start">Model Armor</text><text x="1438" y="320" font-size="13.5" fill="#69757B" font-weight="400" text-anchor="end">米国</text><text x="1018" y="343" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">入力と返事の検査（伏せ字にした文だけ）</text><line x1="928" y1="325" x2="991" y2="325" stroke="#69757B" stroke-width="1.6"/><path d="M 1000 325 L 991 330 L 991 320 z" fill="#69757B"/><rect x="1000" y="364" width="452" height="62" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="1018" y="390" font-size="15.5" fill="#1D2326" font-weight="700" text-anchor="start">Cloud Text-to-Speech</text><text x="1018" y="413" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">ぽてねの声をつくる（返事の文だけ送る）</text><line x1="928" y1="395" x2="991" y2="395" stroke="#69757B" stroke-width="1.6"/><path d="M 1000 395 L 991 400 L 991 390 z" fill="#69757B"/><text x="1004" y="454" font-size="14.5" fill="#2E8C87" font-weight="700" text-anchor="start">データと認証</text><rect x="1000" y="468" width="452" height="62" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="1018" y="494" font-size="15.5" fill="#1D2326" font-weight="700" text-anchor="start">Firestore</text><text x="1438" y="494" font-size="13.5" fill="#69757B" font-weight="400" text-anchor="end">東京</text><text x="1018" y="517" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">利用者ごとに保存。書き込みはサーバーだけ</text><line x1="928" y1="499" x2="991" y2="499" stroke="#69757B" stroke-width="1.6"/><path d="M 1000 499 L 991 504 L 991 494 z" fill="#69757B"/><rect x="1000" y="538" width="452" height="62" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="1018" y="564" font-size="15.5" fill="#1D2326" font-weight="700" text-anchor="start">Firebase Authentication</text><text x="1018" y="587" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">メールとパスワード、メール確認</text><line x1="928" y1="569" x2="991" y2="569" stroke="#69757B" stroke-width="1.6"/><path d="M 1000 569 L 991 574 L 991 564 z" fill="#69757B"/><rect x="1000" y="608" width="452" height="62" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="1018" y="634" font-size="15.5" fill="#1D2326" font-weight="700" text-anchor="start">Secret Manager</text><text x="1018" y="657" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">Gemini のキー。サービスアカウントだけが読める</text><line x1="1000" y1="639" x2="937" y2="639" stroke="#69757B" stroke-width="1.6"/><path d="M 928 639 L 937 634 L 937 644 z" fill="#69757B"/><text x="1004" y="698" font-size="14.5" fill="#2E8C87" font-weight="700" text-anchor="start">運用</text><rect x="1000" y="712" width="452" height="76" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="1018" y="738" font-size="15.5" fill="#1D2326" font-weight="700" text-anchor="start">Cloud Logging・Monitoring</text><text x="1018" y="761" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">構造化ログ（30 日）から、メトリクス 7 つ、</text><text x="1018" y="782" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">ダッシュボード、アラート 3 つ</text><line x1="928" y1="750" x2="991" y2="750" stroke="#69757B" stroke-width="1.6"/><path d="M 1000 750 L 991 755 L 991 745 z" fill="#69757B"/><rect x="1000" y="796" width="452" height="62" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="1018" y="822" font-size="15.5" fill="#1D2326" font-weight="700" text-anchor="start">アップタイム確認・予算</text><text x="1018" y="845" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">/ready を 6 か所から 1 分ごと。予算アラート付き</text><line x1="1000" y1="827" x2="937" y2="827" stroke="#69757B" stroke-width="1.6"/><path d="M 928 827 L 937 822 L 937 832 z" fill="#69757B"/><line x1="286" y1="300" x2="341" y2="300" stroke="#69757B" stroke-width="1.6"/><path d="M 350 300 L 341 305 L 341 295 z" fill="#69757B"/><text x="318" y="288" font-size="13" fill="#69757B" font-weight="400" text-anchor="middle">観測の数値</text><text x="318" y="322" font-size="13" fill="#69757B" font-weight="400" text-anchor="middle">発言の文字</text><line x1="350" y1="392" x2="295" y2="392" stroke="#69757B" stroke-width="1.6"/><path d="M 286 392 L 295 387 L 295 397 z" fill="#69757B"/><text x="318" y="380" font-size="13" fill="#69757B" font-weight="400" text-anchor="middle">音の状態</text><text x="318" y="414" font-size="13" fill="#69757B" font-weight="400" text-anchor="middle">返事と声</text><line x1="158" y1="868" x2="158" y2="891" stroke="#69757B" stroke-width="1.6"/><path d="M 158 900 L 153 891 L 163 891 z" fill="#69757B"/><text x="170" y="889" font-size="13" fill="#69757B" font-weight="400" text-anchor="start">紹介ページを開く</text><rect x="32" y="900" width="252" height="184" rx="6" fill="#FFFFFF" stroke="#D5DDDE" stroke-width="1.5"/><text x="50" y="934" font-size="18" fill="#1D2326" font-weight="700" text-anchor="start">Firebase Hosting</text><text x="50" y="962" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">紹介ページと、制作者の</text><text x="50" y="983" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">ページ（HTML と画像）。</text><text x="50" y="1004" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">CSP などのヘッダー付き</text><text x="50" y="1050" font-size="13.5" fill="#69757B" font-weight="400" text-anchor="start">yurune-1756f.web.app</text><rect x="352" y="900" width="1116" height="184" rx="6" fill="#FFFFFF" stroke="#D5DDDE" stroke-width="1.5"/><text x="372" y="934" font-size="18" fill="#1D2326" font-weight="700" text-anchor="start">公開（デプロイ）の流れ</text><text x="372" y="956" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">手元から gcloud run deploy --source で実行（deploy/deploy.ps1）</text><rect x="368" y="972" width="210" height="104" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="386" y="999" font-size="16" fill="#1D2326" font-weight="700" text-anchor="start">ソース</text><text x="386" y="1023" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">アプリ、Dockerfile、</text><text x="386" y="1044" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">設定のファイル</text><rect x="626" y="972" width="210" height="104" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="644" y="999" font-size="16" fill="#1D2326" font-weight="700" text-anchor="start">Cloud Build</text><text x="644" y="1023" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">Dockerfile から</text><text x="644" y="1044" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">イメージをつくる</text><text x="644" y="1065" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">（版を固定、非 root）</text><rect x="884" y="972" width="210" height="104" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="902" y="999" font-size="16" fill="#1D2326" font-weight="700" text-anchor="start">Artifact Registry</text><text x="902" y="1023" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">イメージを保存。</text><text x="902" y="1044" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">脆弱性スキャン付き</text><line x1="580" y1="1024" x2="615" y2="1024" stroke="#69757B" stroke-width="1.6"/><path d="M 624 1024 L 615 1029 L 615 1019 z" fill="#69757B"/><line x1="838" y1="1024" x2="873" y2="1024" stroke="#69757B" stroke-width="1.6"/><path d="M 882 1024 L 873 1029 L 873 1019 z" fill="#69757B"/><rect x="1112" y="972" width="340" height="104" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="1130" y="999" font-size="16" fill="#1D2326" font-weight="700" text-anchor="start">実行用サービスアカウント</text><text x="1130" y="1023" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">Firestore、ログとトレース、</text><text x="1130" y="1044" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">Model Armor、Gemini のキーの読み取りだけ。</text><text x="1130" y="1065" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">Owner や Editor は付けない</text><line x1="906" y1="972" x2="906" y2="877" stroke="#69757B" stroke-width="1.6"/><path d="M 906 868 L 911 877 L 901 877 z" fill="#69757B"/><text x="918" y="936" font-size="13" fill="#69757B" font-weight="400" text-anchor="start">新しいリビジョンに切り替え</text><rect x="32" y="1108" width="5" height="24" rx="2" fill="#2E8C87" stroke="none" stroke-width="0"/><text x="48" y="1126" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">青緑の印は、Gemini に聞く所です。ほかは、コードだけで決まります。</text></svg>